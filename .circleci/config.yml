version: 2.1

orbs:
  codecov: codecov/codecov@3
  macos: circleci/macos@2.4
  win: circleci/windows@5.0

commands:
  run-cibuildwheel:
    parameters:
      cibw-config:  # environment variables
        type: string
        default: ""
      cibw-version:
        type: string
        default: 4.3.5    # latest as of November 2026
    steps:
      - run:
          name: run cibuildwheel
          shell: bash -eo pipefail
          command: |
            python -m pip install --user cibuildwheel==<< parameters.cibw-version >>
            << parameters.cibw-config >> python -m cibuildwheel --output-dir dist
      - store_artifacts: &store-artifacts
          path: ./dist
      - persist_to_workspace: &persist-to-workspace
          root: ./dist/
          paths: .

environment: &global-environment
  PIP_PROGRESS_BAR: 'off'

jobs:
  build-and-test-linux:
    docker:
      - image: cimg/python:3.12

    environment:
      <<: *global-environment
      CIBW_ARCHS_LINUX: x86_64

    steps:
      - checkout
      - setup_remote_docker
      - run-cibuildwheel

  build-and-test-linux-aarch64:
    machine:
      image: default

    resource_class: arm.medium

    environment:
      <<: *global-environment
      CIBW_ARCHS_LINUX: aarch64

    steps:
      - checkout
      - run-cibuildwheel

  build-and-test-osx:
    macos:
      xcode: 27.3.0   # latest as of November 2026

    environment:
      <<: *global-environment

    steps:
      - checkout
      - macos/install-rosetta
      - run-cibuildwheel

  build-sdist:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout
      - run:
          name: build sdist
          command: |
            python -m venv env
            . env/bin/activate
            pip install build pip --upgrade
            python -m build --sdist
      - store_artifacts: *store-artifacts
      - persist_to_workspace: *persist-to-workspace

  build-and-test-windows:
    executor:
      name: win/default

    environment:
      <<: *global-environment
      CIBW_ARCHS_WINDOWS: AMD64

    steps:
      - checkout
      - run: choco install llvm -y
      - run-cibuildwheel:
          cibw-config: CIBW_ENVIRONMENT_PASS=CXX CXX=clang-cl

  check-dist:
    docker:
      - image: cimg/python:3.12

    steps:
      - attach_workspace:
          at: dist

      - run:
          name: check package
          command: |
            python -m venv env
            . env/bin/activate
            python -m pip install twine
            twine check ./dist/*

  deploy-all:
    docker:
      - image: cimg/python:3.12

    steps:
      - attach_workspace:
          at: dist

      - store_artifacts:
          path: ./dist

      - run:
          name: deploy
          command: |
            python -m venv env
            . env/bin/activate
            python -m pip install twine
            twine upload -u "$PYPI_USERNAME" -p "$PYPI_PASSWORD" --skip-existing ./dist/*

  test-doctest:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout
      - attach_workspace:
          at: dist
      - run:
          name: install dependencies and package
          command: |
            python -m venv env
            . env/bin/activate
            pip install pip --upgrade
            pip install --group dev --group docs
            pip install dwave-samplers --no-index -f dist/ --no-deps --force-reinstall
      - run:
          name: build docs
          command: |
            . env/bin/activate
            make -C docs/ html
      - store_artifacts:
          path: ./docs/build/html
      - run:
          name: doctest
          command: |
            . env/bin/activate
            make -C docs/ doctest
      - run:
          name: linkcheck
          command: |
            . env/bin/activate
            make -C docs/ linkcheck

  test-dependencies:
    parameters:
      python-version:
        type: string

    docker:
      - image: python:<< parameters.python-version >>-slim

    steps:
      - checkout
      - attach_workspace:
          at: dist

      - run:
          name: select wheel
          command: |
            pip download --no-index --no-deps --only-binary=:all: \
              -f dist --dest /tmp/wheel dwave-samplers

      - run:
          name: install oldest dependencies
          command: |
            python -m venv env
            . env/bin/activate
            pip install pip --upgrade
            pip install --group deps-oldest /tmp/wheel/*.whl

      - run: &unix-run-tests
          name: run tests
          command: |
            . env/bin/activate
            pip install pip --upgrade
            pip install --group test
            cd tests
            python -m unittest
            rm -r ../env

      - run:
          name: install latest dependencies
          command: |
            python -m venv env
            . env/bin/activate
            pip install pip --upgrade
            pip install --upgrade-strategy=eager /tmp/wheel/*.whl

      - run: *unix-run-tests

  test-linux-cpp:
    docker:
      - image: cimg/python:3.12

    steps: &cpp-tests
      - checkout

      - run:
          name: Install requirements
          command: |
            python -m venv env
            . env/bin/activate
            pip install pip --upgrade
            pip install --group dev --group test

      - run:
          name: run cpp tests
          command: |
            . env/bin/activate
            meson setup _build -Dwerror=true -Dbuild-tests="enabled"
            meson compile -C _build
            meson test -C _build

      - run:
          name: run cpp tests with debug symbols
          command: |
            . env/bin/activate
            meson setup _build -Dbuildtype=debug --reconfigure
            meson compile -C _build
            meson test -C _build

  test-osx-cpp:
    macos:
      xcode: 26.2.0  # latest as of Jan 2026

    steps: *cpp-tests

  test-sdist:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout
      - attach_workspace:
          at: dist
      - run:
          name: install from sdist
          command: |
            python -m venv env
            . env/bin/activate
            pip install dist/dwave?samplers*.tar.gz
      - run: *unix-run-tests

workflows:
  tests:
    jobs:
      - build-and-test-linux:
          filters: &tags
            # also run on tags so the deploy pipeline works
            tags:
              only: &version-string /^[0-9]+(\.[0-9]+)*((\.dev|rc)([0-9]+)?)?$/
      - build-and-test-linux-aarch64:
          filters: *tags
      - build-and-test-osx:
          filters: *tags
      - build-and-test-windows:
          filters: *tags
      - build-sdist:
          filters: *tags
      - test-doctest:
          filters: *tags
          requires:
            - build-and-test-linux
      - test-dependencies:
          name: test-dependencies-python<< matrix.python-version >>
          filters: *tags
          requires:
            - build-and-test-linux
          matrix:
            parameters:
              # Skip some of the intermediate Python versions for speed
              python-version: ["3.11", "3.15"]
      - test-linux-cpp:
          filters: *tags
      - test-osx-cpp:
          filters: *tags
      - test-sdist:
          filters: *tags
          requires:
            - build-sdist
      - check-dist:
          filters: *tags
          requires:
            - build-and-test-linux
            - build-and-test-linux-aarch64
            - build-and-test-osx
            - build-and-test-windows
            - build-sdist
      - deploy-all:
          filters:
            tags:
              only: *version-string
            branches:
              ignore: /.*/
          requires:
            - build-and-test-linux
            - build-and-test-linux-aarch64
            - build-and-test-osx
            - build-and-test-windows
            - build-sdist
            - check-dist
